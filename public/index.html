<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>402</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232e6a5b'/%3E%3Ctext x='16' y='22' font-size='13' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E402%3C/text%3E%3C/svg%3E" />
<script>
  /* 在样式应用之前定好主题，避免打开时闪一下白屏。 */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('reshub_theme'); } catch (e) {}
    if (saved !== 'light' && saved !== 'dark') {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
<style>
  /* ═══ 设计令牌 ═══════════════════════════════════════════════
     规则里不出现裸的颜色或圆角数值，一律引用这里的变量。
     黑夜模式只覆盖变量，不改任何规则。                      */
  :root {
    --bg:          #fbfbfa;
    --surface:     #ffffff;
    --surface-2:   #f5f5f3;
    --text:        #1a1a19;
    --text-2:      #4a4a47;
    --muted:       #8a8a84;
    --line:        #e7e7e4;
    --line-2:      #f0f0ed;
    --accent:      #2e6a5b;
    --accent-soft: #e3efea;
    --danger:      #a13d34;
    --danger-soft: #f7eeed;
    --on-accent:   #ffffff;
    --warn-soft:   #fff8e6;
    --warn-line:   #efd9a4;
    --warn-ink:    #7a5a1e;

    --radius-xs: 6px;
    --radius-sm: 11px;
    --radius-md: 16px;
    --radius-pill: 999px;

    --shadow-modal: 0 24px 60px -30px rgba(20, 20, 18, .55);
    --overlay: rgba(20, 20, 18, .38);

    --serif: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", "宋体", Georgia, serif;
    --sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;

    --gap: 16px;
    --pad: 20px;
  }

  :root[data-theme="dark"] {
    --bg:          #121312;
    --surface:     #1a1b19;
    --surface-2:   #212220;
    --text:        #eceae6;
    --text-2:      #b9b8b2;
    --muted:       #83837d;
    --line:        #2c2d2a;
    --line-2:      #232421;
    --accent:      #71c1a6;
    --accent-soft: #1c3129;
    --danger:      #e0908a;
    --danger-soft: #332422;
    --on-accent:   #0e1a16;
    --warn-soft:   #2a2416;
    --warn-line:   #574a24;
    --warn-ink:    #e0c37a;

    --shadow-modal: 0 24px 60px -30px rgba(0, 0, 0, .9);
    --overlay: rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select, button { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  .shell { width: min(1080px, 100% - 40px); margin: 0 auto; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-xs); }

  /* ── 刊头 ─────────────────────────────────────────────────── */
  .masthead { padding: 30px 0 0; }
  .masthead-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand h1 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .05em; }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .search {
    display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 13px; min-width: 280px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-pill);
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { flex: 0 0 auto; color: var(--muted); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: 0; }
  .search .clr { display: none; border: 0; background: transparent; color: var(--muted); padding: 0 2px; }
  .search.has .clr { display: block; }

  /* ── 按钮 ─────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; padding: 0 15px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
    font-size: 14px; font-weight: 600; white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
  }
  .btn:hover { border-color: var(--text-2); color: var(--text); }
  .btn-solid { background: var(--text); border-color: var(--text); color: var(--bg); }
  .btn-solid:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .btn-icon { width: 40px; padding: 0; }
  .btn-text { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-text:hover { background: var(--surface-2); border-color: transparent; }

  .who { display: flex; align-items: center; gap: 8px; }
  .who .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); font-weight: 700; font-size: 12.5px; }
  .who b { font-size: 13.5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .lede { margin: 20px 0 0; max-width: 60ch; color: var(--text-2); }

  /* 用量提醒：只在快满或已满时出现，平时不占地方 */
  .banner {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 0; padding: 11px 15px;
    border: 1px solid var(--warn-line); border-radius: var(--radius-sm);
    background: var(--warn-soft); color: var(--warn-ink);
    font-size: 13.5px; line-height: 1.6;
  }
  .banner.blocked { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }

  /* ── 分类 ─────────────────────────────────────────────────── */
  .drawers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); }
  .drawer {
    position: relative; border: 0; background: transparent;
    padding: 8px 13px 10px; font-size: 13.5px; font-weight: 600; color: var(--muted);
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }
  .drawer:hover { color: var(--text); background: var(--surface-2); }
  .drawer::after {
    content: ""; position: absolute; left: 11px; right: 11px; bottom: -1px; height: 2px;
    background: var(--accent); transform: scaleX(0); transition: transform .18s ease;
  }
  .drawer.on { color: var(--text); }
  .drawer.on::after { transform: scaleX(1); }
  .drawer .n { margin-left: 5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 平台子项：只在「软件」分类下出现，收在分类里面 */
  .subdrawers { display: flex; align-items: center; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .subdrawers[hidden] { display: none; }
  .subdrawers .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .sub {
    border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-pill);
    padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--text-2);
  }
  .sub:hover { border-color: var(--text-2); color: var(--text); }
  .sub.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ── 工具条 ───────────────────────────────────────────────── */
  .toolbar { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 12px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: .03em; }
  .toolbar .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .sort { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .sort select {
    border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
    border-radius: var(--radius-pill); padding: 5px 11px;
    font-size: 13px; font-weight: 600; outline: 0; cursor: pointer;
  }
  .sort select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .scope { display: inline-flex; gap: 2px; }
  .scope button {
    border: 0; background: transparent; border-radius: var(--radius-sm);
    padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted);
  }
  .scope button:hover { color: var(--text); }
  .scope button.on { background: var(--accent-soft); color: var(--accent); }

  /* ── 资源条目 ─────────────────────────────────────────────── */
  .list {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-md); overflow: hidden;
  }
  .row {
    display: grid; grid-template-columns: 48px minmax(0, 1fr) auto;
    gap: var(--gap); align-items: center;
    padding: 15px var(--pad); border-bottom: 1px solid var(--line-2);
    transition: background .15s;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--surface-2); }

  .ext {
    font-size: 11px; font-weight: 700; letter-spacing: .07em;
    color: var(--muted); align-self: start; padding-top: 4px;
  }
  .main { min-width: 0; }
  .item-title {
    margin: 0 0 2px; font-family: var(--serif);
    font-size: 16.5px; font-weight: 700; line-height: 1.5; letter-spacing: .01em;
    word-break: break-word;
  }
  .tag {
    display: inline-block; vertical-align: 2px; margin-left: 8px;
    padding: 1px 7px; border-radius: var(--radius-xs);
    font-family: var(--sans); font-size: 11.5px; font-weight: 700;
    color: var(--accent); background: var(--accent-soft);
  }
  .item-desc {
    margin: 0 0 4px; max-width: 58ch; color: var(--muted); font-size: 13.5px; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 3px 15px; font-size: 12.5px; color: var(--muted); }
  .meta .num { font-variant-numeric: tabular-nums; }

  .acts { display: flex; align-items: center; gap: 6px; }
  .dl {
    display: inline-flex; align-items: center; height: 32px; padding: 0 14px;
    border-radius: var(--radius-sm); border: 1px solid var(--line);
    color: var(--text-2); font-size: 13px; font-weight: 600;
    transition: background .15s, border-color .15s, color .15s;
  }
  .dl:hover { background: var(--text); border-color: var(--text); color: var(--bg); }
  .rm {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    transition: border-color .15s, color .15s, background .15s;
  }
  .rm:hover { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

  .empty { padding: 54px 24px; text-align: center; }
  .empty h3 { margin: 0 0 7px; font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .empty p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }

  /* ── 弹窗 ─────────────────────────────────────────────────── */
  .mask {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: var(--overlay); overflow-y: auto;
  }
  .mask.show { display: flex; }
  .modal {
    width: min(520px, 100%); margin: auto;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-md); box-shadow: var(--shadow-modal);
    animation: rise .18s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 22px 0; }
  .modal-head h2 { margin: 0 0 3px; font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: .03em; }
  .modal-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .modal-body { padding: 18px 22px 4px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 22px; }

  .x {
    width: 32px; height: 32px; flex: 0 0 auto; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 14px; line-height: 1;
  }
  .x:hover { border-color: var(--text-2); color: var(--text); }

  .f { margin-bottom: 13px; }
  .f > label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .f > label i { font-style: normal; font-weight: 400; color: var(--muted); }
  .f input, .f textarea, .f select {
    width: 100%; padding: 9px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface); outline: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .f input:focus, .f textarea:focus, .f select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .f input:disabled { background: var(--surface-2); color: var(--muted); }
  .f textarea { min-height: 74px; resize: vertical; line-height: 1.65; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .field-hidden { display: none; }

  .drop {
    display: block; width: 100%; text-align: center; cursor: pointer;
    border: 1px dashed var(--line); border-radius: var(--radius-sm);
    background: var(--surface-2); padding: 22px 16px;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop b { display: block; font-size: 14px; }
  .drop span { font-size: 12.5px; color: var(--muted); }
  .picked { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); font-size: 13.5px; }
  .picked .x2 { margin-left: auto; border: 0; background: transparent; color: var(--muted); }

  .tabs { display: flex; gap: 2px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
  .tabs button { position: relative; border: 0; background: transparent; padding: 8px 13px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .tabs button.on { color: var(--text); }
  .tabs button.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; background: var(--accent); }
  .hint { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.65; }

  ol.notes { margin: 0 0 18px; padding-left: 20px; }
  ol.notes li { margin-bottom: 9px; font-size: 13.5px; line-height: 1.75; color: var(--text-2); }
  ol.notes li:last-child { margin-bottom: 0; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .chk input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

  .progress { display: none; height: 4px; margin-top: 12px; border-radius: var(--radius-pill); background: var(--line); overflow: hidden; }
  .progress.on { display: block; }
  .progress i { display: block; width: 0; height: 100%; background: var(--accent); transition: width .15s; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; z-index: 90;
    max-width: calc(100% - 40px); padding: 10px 17px; border-radius: var(--radius-sm);
    background: var(--text); color: var(--bg); font-size: 13.5px; font-weight: 600;
    opacity: 0; transform: translate(-50%, 12px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer {
    margin-top: auto; padding: 36px 0 32px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    color: var(--muted); font-size: 13px;
  }
  .foot-link {
    border: 0; background: transparent; padding: 0;
    color: var(--accent); font-size: 13px; font-weight: 600;
    text-decoration: underline; text-underline-offset: 3px;
  }

  @media (max-width: 720px) {
    .shell { width: min(1080px, 100% - 28px); }
    .tools { width: 100%; margin-left: 0; }
    .search { flex: 1 1 100%; min-width: 0; order: 2; }
    .row { grid-template-columns: 42px minmax(0, 1fr); gap: 12px; padding: 14px 16px; }
    .row .acts { grid-column: 2; }
    .dl { height: 34px; }
    .row2 { grid-template-columns: 1fr; }
    .modal-foot .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }


  /* ═══ 云端版新增：邀请码、角色徽章、上传进度、管理面板 ═══ */
  .vis {
    display: inline-block; padding: 1px 7px; border-radius: var(--radius-xs);
    font-size: 11.5px; font-weight: 700;
    background: var(--surface-2); color: var(--muted);
  }
  .vis.locked { background: var(--accent-soft); color: var(--accent); }

  .role {
    display: inline-block; margin-left: 6px; padding: 1px 7px;
    border-radius: var(--radius-xs); font-size: 11.5px; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
  }

  .progress-text {
    margin-top: 7px; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .code {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 13.5px; letter-spacing: .08em; color: var(--text);
  }

  .invite-list { margin: 0; padding: 0; list-style: none; max-height: 260px; overflow-y: auto; }
  .invite-list li {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13px;
  }
  .invite-list li:last-child { border-bottom: 0; }
  .invite-list .meta { margin-left: auto; color: var(--muted); font-size: 12.5px; text-align: right; }
  .invite-list .dead { color: var(--muted); text-decoration: line-through; }

  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-pill);
    padding: 5px 13px; font-size: 13px; font-weight: 600; color: var(--text-2);
  }
  .seg button:hover { border-color: var(--text-2); color: var(--text); }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .file-note { font-size: 12.5px; color: var(--muted); margin-top: 7px; line-height: 1.6; }

  /* ═══ 背景字母：淡，但看得见；随机飘，点一下有回应 ═══════ */
  .bg-decor {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  /* 正文和页脚抬到装饰层上面。弹窗和提示本来层级就更高，不受影响。 */
  body > header, body > main, body > footer { position: relative; z-index: 1; }
  .bg-decor span {
    position: absolute;
    font-family: var(--serif); font-weight: 700; letter-spacing: .08em;
    white-space: nowrap; color: var(--accent);
    opacity: 0; will-change: transform, opacity;
    animation: drift var(--life, 18s) ease-in-out forwards;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translate3d(0, 22px, 0) rotate(var(--tilt, 0deg)) scale(.94); }
    16%  { opacity: var(--peak, .08); }
    74%  { opacity: var(--peak, .08); }
    100% { opacity: 0; transform: translate3d(var(--drift, 18px), -40px, 0) rotate(var(--tilt, 0deg)) scale(1.05); }
  }

  /* 点下去的反馈：按钮缩一点，落点冒一圈涟漪 */
  .btn, .dl, .drawer, .sub, .scope button, .seg button, .foot-link, .x, .rm, .drop, .tabs button {
    transition: transform .12s ease, box-shadow .16s ease, border-color .15s ease,
                background .15s ease, color .15s ease;
  }
  .btn:active, .dl:active, .drawer:active, .sub:active, .scope button:active,
  .seg button:active, .foot-link:active, .rm:active, .drop:active, .tabs button:active { transform: scale(.97); }
  .ripple {
    position: fixed; pointer-events: none; z-index: 80;
    width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; border: 1.5px solid var(--accent);
    animation: ripple .55s ease-out forwards;
  }
  @keyframes ripple {
    0%   { transform: scale(.4); opacity: .5; }
    100% { transform: scale(4.2); opacity: 0; }
  }

  /* 图片预览 */
  .preview { display: grid; place-items: center; gap: 12px; }
  .preview img {
    max-width: 100%; max-height: 62vh; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface-2);
  }
  .acts .btn-sm { height: 32px; }</style>
</head>
<body>

  <div class="toast" id="toast" aria-live="assertive"></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var ICON_SUN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  var NOTES_KEY = 'reshub_notes_hidden';
  var THEME_KEY = 'reshub_theme';

  var state = {
    me: null,
    categories: [],
    platforms: [],
    visibilities: [],
    resources: [],
    counts: {},
    query: '',
    category: 'all',
    platform: 'all',
    sort: 'new',
    scope: 'all',
    pickedFile: null,
    visibility: 'public',
    authMode: 'login',
    pendingUpload: false,
    seq: 0,
    usage: null,
    quota: null,
    adminTab: 'invites',
    adminResources: [],
    editingId: null,
    editVisibility: 'public',
  };

  /* ── 基础工具 ───────────────────────────────────────────── */
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function initial(name) { return (String(name || '?').trim()[0] || '?').toUpperCase(); }
  function avatarColor(name) {
    var tones = ['#2e6a5b', '#3f5d7a', '#78581d', '#5b4a72', '#6d4a3f', '#456b63'];
    var h = 0;
    var s = String(name || '?');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
    return tones[h % tones.length];
  }
  function timeAgo(iso) {
    var t = new Date(iso).getTime();
    if (!t) return '';
    var minutes = Math.floor((Date.now() - t) / 60000);
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return minutes + ' 分钟前';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小时前';
    var days = Math.floor(hours / 24);
    if (days < 30) return days + ' 天前';
    return Math.floor(days / 30) + ' 个月前';
  }
  /* 能在线看的只有图片；视频按需求不做预览。 */
  var IMAGE_RE = /\.(png|jpe?g|gif|webp|bmp|avif)$/i;
  function isImageName(name) { return IMAGE_RE.test(String(name || '')); }

  function extOf(fileName) {
    var m = /\.([A-Za-z0-9]{1,5})$/.exec(String(fileName || ''));
    return m ? m[1].toUpperCase() : 'FILE';
  }
  function findById(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  var catOf = function (id) { return findById(state.categories, id) || { id: 'other', name: '其他' }; };
  var canUpload = function () { return !!state.me && state.me.role !== 'guest'; };
  var isAdmin = function () { return !!state.me && state.me.role === 'admin'; };
  var ROLE_NAME = { admin: '管理员', member: '成员', guest: '游客' };

  var toastTimer;
  function toast(message) {
    var el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  async function api(path, options) {
    var opts = options || {};
    var headers = Object.assign({}, opts.headers || {});
    var init = { method: opts.method || 'GET', headers: headers, credentials: 'same-origin' };
    if (opts.raw !== undefined) init.body = opts.raw;
    else if (opts.body !== undefined) {
      headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    var res = await fetch(path, init);
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok || (data && data.ok === false)) {
      throw new Error((data && data.error) || '网络不太顺，稍后再试试');
    }
    return data;
  }

  /* ── 弹窗：记住焦点、锁住 Tab、关掉还回去 ───────────────── */
  var modalStack = [];
  var dismissers = {};

  function openModal(mask) {
    var previous = document.activeElement;
    mask.classList.add('show');
    modalStack.push({ mask: mask, previous: previous });
    var target = mask.querySelector('[data-focus]') || mask.querySelector('input:not([type=hidden]), select, textarea, button, a[href]');
    if (target) setTimeout(function () { target.focus(); }, 30);
  }
  function closeModal(mask) {
    mask.classList.remove('show');
    for (var i = modalStack.length - 1; i >= 0; i--) {
      if (modalStack[i].mask === mask) {
        var previous = modalStack[i].previous;
        modalStack.splice(i, 1);
        if (previous && previous.focus) previous.focus();
        break;
      }
    }
  }
  function topModal() { return modalStack.length ? modalStack[modalStack.length - 1].mask : null; }
  function dismiss(mask) {
    var fn = dismissers[mask.id];
    if (fn) return fn();
    closeModal(mask);
  }

  document.addEventListener('keydown', function (e) {
    var mask = topModal();
    if (!mask) return;
    if (e.key === 'Escape') { e.preventDefault(); dismiss(mask); return; }
    if (e.key !== 'Tab') return;
    var items = mask.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled])');
    if (!items.length) return;
    var first = items[0];
    var last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ── 主题 ───────────────────────────────────────────────── */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    var btn = $('themeBtn');
    var dark = theme === 'dark';
    btn.innerHTML = dark ? ICON_SUN : ICON_MOON;
    var label = dark ? '切换到浅色模式' : '切换到深色模式';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
  $('themeBtn').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── 背景字母与点击反馈 ─────────────────────────────────── */
  var BG_LETTERS = ['hc', 'lfl', 'hs', 'cyr', 'cwn', 'cxx'];
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* 一次撒 1~3 个字母出去，位置、大小、透明度都随机，
     飘完自己收场，不留在 DOM 里堆着。 */
  function sprinkleLetters() {
    var layer = $('bgDecor');
    if (!layer || document.hidden || reduceMotion) return;

    var count = Math.random() < 0.45 ? 1 : (Math.random() < 0.7 ? 2 : 3);
    for (var i = 0; i < count; i++) {
      var node = document.createElement('span');
      node.textContent = BG_LETTERS[Math.floor(Math.random() * BG_LETTERS.length)];
      node.style.fontSize = (44 + Math.random() * 110).toFixed(0) + 'px';
      node.style.left = (Math.random() * 88).toFixed(1) + '%';
      node.style.top = (6 + Math.random() * 76).toFixed(1) + '%';
      node.style.setProperty('--peak', (0.06 + Math.random() * 0.07).toFixed(3));
      node.style.setProperty('--life', (14 + Math.random() * 12).toFixed(1) + 's');
      node.style.setProperty('--tilt', (Math.random() * 18 - 9).toFixed(1) + 'deg');
      node.style.setProperty('--drift', (Math.random() * 70 - 35).toFixed(0) + 'px');
      node.style.animationDelay = (Math.random() * 1600).toFixed(0) + 'ms';
      layer.appendChild(node);
      node.addEventListener('animationend', function (e) { e.target.remove(); });
      /* 万一动画事件没来（标签页切走之类），兜个底。 */
      setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(node), 32000);
    }
  }

  function startBackgroundLetters() {
    if (!$('bgDecor')) return;
    sprinkleLetters();
    setInterval(sprinkleLetters, 4200);
  }

  /* 点哪儿哪儿冒一圈，看得见"点到了"。 */
  document.addEventListener('pointerdown', function (e) {
    if (reduceMotion || e.button !== 0) return;
    var dot = document.createElement('span');
    dot.className = 'ripple';
    dot.style.left = e.clientX + 'px';
    dot.style.top = e.clientY + 'px';
    document.body.appendChild(dot);
    dot.addEventListener('animationend', function () { dot.remove(); });
  });
  /* ── 顶栏与欢迎语 ───────────────────────────────────────── */
  function renderWelcome() {
    var el = $('welcome');
    if (!state.me) {
      el.textContent = '欢迎，随便看看。想要上传自己的文件，得有邀请码。';
      return;
    }
    el.textContent = state.me.role === 'guest'
      ? '你是游客，可以随便下载；需要上传再找管理员换个角色。'
      : '欢迎回来，' + state.me.username + '。要分享新东西，点右上角就行。';
  }

  function renderUser() {
    var area = $('userArea');
    if (state.me) {
      var adminBtn = isAdmin() ? '<button class="btn btn-sm" id="adminBtn" type="button">邀请码</button>' : '';
      var upBtn = canUpload() ? '<button class="btn btn-sm btn-solid" id="upBtn" type="button">上传文件</button>' : '';
      area.innerHTML = '<div class="who"><span class="av" style="background:' + avatarColor(state.me.username) + '">'
        + esc(initial(state.me.username)) + '</span><b>' + esc(state.me.username)

  async function loadList() {
    var mine = ++state.seq;
    var params = new URLSearchParams();
    if (state.query) params.set('q', state.query);
    if (state.category !== 'all') params.set('category', state.category);
    if (state.category === 'software' && state.platform !== 'all') params.set('platform', state.platform);
    if (state.scope === 'me') params.set('owner', 'me');
    if (state.sort) params.set('sort', state.sort);
    try {
      var data = await api('/api/resources?' + params.toString());
      if (mine !== state.seq) return;
      state.resources = data.resources;

      if (mine !== state.seq) return;

  function resetDrop() {
    $('drop').outerHTML = '<button type="button" class="drop" id="drop">'
      + '<b>点这里选一个文件</b>'
      + '<span>也可以直接把文件拖进来，大文件会自动分块传</span></button>';
    wireDrop();

  function showPicked() {
    var mb = (state.pickedFile.size / 1048576).toFixed(state.pickedFile.size < 1048576 ? 3 : 1);
    $('drop').outerHTML = '<div class="picked" id="drop">'
      + '<span style="flex:1;word-break:break-all">' + esc(state.pickedFile.name)
      + ' <span style="color:var(--muted)">' + mb + ' MB</span></span>'
      + '<button class="x2" type="button" id="unpick" aria-label="移除已选的文件">✕</button></div>';
    $('unpick').addEventListener('click', function () {
      state.pickedFile = null;
      $('file').value = '';
      resetDrop();
    });
  }
  function wireDrop() {
    var drop = $('drop');
    drop.addEventListener('click', function () { $('file').click(); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      drop.classList.remove('over');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        state.pickedFile = e.dataTransfer.files[0];
        showPicked();
      }
    });
  }

  function syncPlatformField() {
    $('platformField').classList.toggle('field-hidden', $('uCat').value !== 'software');
  }
  function renderVisibilitySeg() {
    $('visibilitySeg').innerHTML = state.visibilities.map(function (v) {
      return '<button type="button" class="' + (state.visibility === v.id ? 'on' : '') + '" data-vis="' + v.id + '">'
        + esc(v.name) + '</button>';

  function openUpload() {
    if (!state.me) {
      state.pendingUpload = true;

      toast('登录之后就可以上传了');

    state.pickedFile = null;

    resetDrop();
    $('uCat').innerHTML = state.categories.map(function (c) {
      return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
    }).join('');
    $('uPlatform').innerHTML = '<option value="">不指定</option>' + state.platforms.map(function (p) {
      return '<option value="' + p.id + '">' + esc(p.name) + '</option>';
    }).join('');
    syncPlatformField();
    renderVisibilitySeg();
    $('prog').classList.remove('on');
    $('prog').firstElementChild.style.width = '0%';

    openModal($('uploadMask'));

  /* 同时跑几路。一路太慢，太多又容易把小水管和 Worker 的内存挤爆，4 路比较稳。 */
  var UPLOAD_LANES = 4;

  /* 把文件切开，几路一起发。每片都远小于 Cloudflare 的请求体上限。
     分片直接以 Blob 交给 fetch，浏览器边读边发，不用先在内存里攒一整块。 */
  async function sendFileInParts(file, meta, onPart) {
    var started = await api('/api/uploads', { method: 'POST', body: { fileName: file.name, fileSize: file.size } });
    var partCount = Math.max(1, Math.ceil(file.size / started.partSize));
    var parts = new Array(partCount);
    var next = 1;
    var done = 0;

    async function lane() {
      for (;;) {
        var i = next++;
        if (i > partCount) return;
        var from = (i - 1) * started.partSize;
        var slice = file.slice(from, Math.min(from + started.partSize, file.size));
        var uploaded = await api('/api/uploads/part', {
          method: 'PUT',
          raw: slice,
          headers: {
            'Content-Type': 'application/octet-stream',
            'X-R2-Key': started.key,
            'X-Upload-Id': started.uploadId,
            'X-Part-Number': String(i),
            'X-Part-Count': String(partCount),
          },
        });
        parts[i - 1] = { partNumber: uploaded.partNumber, etag: uploaded.etag };
        done += 1;
        onPart(done, partCount);
      }
    }

    try {
      var lanes = [];
      var width = Math.min(UPLOAD_LANES, partCount);
      for (var n = 0; n < width; n++) lanes.push(lane());
      await Promise.all(lanes);
    } catch (err) {
      /* 传了一半失败就把这次上传放弃掉，别在服务器上留垃圾。 */
      api('/api/uploads/abort', {
        method: 'POST',
        body: { key: started.key, uploadId: started.uploadId },
      }).catch(function () {});
      throw err;
    }

    return api('/api/uploads/complete', {
      method: 'POST',
      body: {
        key: started.key,
        uploadId: started.uploadId,
        resourceId: started.resourceId,
        partSize: started.partSize,
        parts: parts,
        meta: meta,
        file: { name: file.name, size: file.size, mime: file.type || 'application/octet-stream' },
      },
    });
  }

  async function doUpload(e) {
    e.preventDefault();
    if (!state.pickedFile) { toast('好像还没选文件'); return; }
    if (state.pickedFile.size === 0) { toast('这个文件是空的，换一个吧'); return; }

    var button = $('uploadSubmit');
    button.disabled = true;
    button.textContent = '上传中…';
    $('prog').classList.add('on');
    $('progText').hidden = false;

    var meta = {
      title: $('uTitle').value.trim() || state.pickedFile.name,
      description: $('uDesc').value.trim(),
      category: $('uCat').value,
      platform: $('uCat').value === 'software' ? $('uPlatform').value : '',
      visibility: state.visibility,
    };

    try {
      await sendFileInParts(state.pickedFile, meta, function (done, total) {
        var percent = Math.round(done / total * 100);
        $('prog').firstElementChild.style.width = percent + '%';
        $('progText').textContent = total > 1
          ? '正在传第 ' + done + ' / ' + total + ' 块 · ' + percent + '%'
          : '正在传 · ' + percent + '%';
      });
      closeModal($('uploadMask'));
      toast('传好了，大家现在能搜到它');
      loadUsage();
      loadQuota();
      state.category = 'all';
      state.platform = 'all';
      setScope('all');
      renderCats();
      loadCounts();
      loadList();
    } catch (err) {
      toast(err.message);
    } finally {
      button.disabled = false;
      button.textContent = '上传';
      $('prog').classList.remove('on');
      $('progText').hidden = true;
    }
  }

  /* ── 登录 / 注册 ────────────────────────────────────────── */
  function syncAuth() {
    var tabs = document.querySelectorAll('#authTabs button');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.toggle('on', tabs[i].dataset.tab === state.authMode);
    var isLogin = state.authMode === 'login';
    $('authTitle').textContent = isLogin ? '登录' : '注册';
    $('authSub').textContent = isLogin ? '登录之后就能上传和管理自己的文件了' : '填上管理员给你的邀请码';
    $('authSubmit').textContent = isLogin ? '登录' : '注册并登录';
    $('authHint').textContent = isLogin
      ? '还没有账号？切到「注册」，需要邀请码。'
      : '密码至少 8 位，两次要输入一致。';
    $('inviteField').classList.toggle('field-hidden', isLogin);
    $('acctInvite').required = !isLogin;
    $('pass2Field').classList.toggle('field-hidden', isLogin);
    $('acctPass2').required = !isLogin;
    $('acctPass').setAttribute('autocomplete', isLogin ? 'current-password' : 'new-password');
  }
  function openAuth(mode) {
    state.authMode = mode || 'login';
    syncAuth();
    $('authForm').reset();
    openModal($('authMask'));
  }

  function doAuth(e) {
    e.preventDefault();
    var button = $('authSubmit');
    button.disabled = true;
    var password = $('acctPass').value;
    if (state.authMode === 'register' && password !== $('acctPass2').value) {
      toast('两次输入的密码不一样，再对一遍');
      $('acctPass2').focus();
      return;
    }

    var body = {
      username: $('acctName').value.trim(),
      password: password,
    };
    if (state.authMode === 'register') body.inviteCode = $('acctInvite').value.trim();

    api('/api/' + state.authMode, { method: 'POST', body: body })
      .then(function (data) {
        var wasLogin = state.authMode === 'login';
        state.me = data.user;
        closeModal($('authMask'));
        renderUser();
        toast(wasLogin ? '登录成功，' + state.me.username : '账号建好了，欢迎加入');
        if (state.pendingUpload) {
          state.pendingUpload = false;
          setTimeout(openUpload, 180);
        }
        return loadList();
      })
      .catch(function (err) { toast(err.message); })
      .then(function () { button.disabled = false; });
  }

  function logout() {
    api('/api/logout', { method: 'POST' }).then(function () {
      state.me = null;
      renderUser();
      setScope('all');
      toast('已经退出了');
    });
  }

  /* ── 管理面板：邀请码 ───────────────────────────────────── */
  function inviteItemHTML(invite) {
    var dead = invite.revoked || (invite.expiresAt && new Date(invite.expiresAt).getTime() < Date.now())
      || invite.usedCount >= invite.maxUses;
    var meta = '用了 ' + invite.usedCount + ' / ' + invite.maxUses;
    if (invite.expiresAt) meta += ' · ' + new Date(invite.expiresAt).toLocaleDateString('zh-CN');
    var kill = dead ? '' : '<button class="btn btn-sm" type="button" data-revoke="' + esc(invite.code) + '">作废</button>';
    return '<li><span class="code' + (dead ? ' dead' : '') + '">' + esc(invite.formatted) + '</span>'
      + '<span class="vis">' + esc(ROLE_NAME[invite.role] || invite.role) + '</span>'
      + kill
      + '<span class="meta">' + esc(meta) + (dead ? ' · 已失效' : '') + '</span></li>';
  }

  async function loadInvites() {
    try {
      var data = await api('/api/admin/invites');
      $('inviteList').innerHTML = data.invites.length
        ? data.invites.map(inviteItemHTML).join('')
        : '<li><span class="meta" style="margin-left:0">还没有发过邀请码</span></li>';
    } catch (err) {
      toast(err.message);
    }
  }

  /* 拉一次用量。只有管理员能看，其它人请求会被拒，忽略即可。 */
  async function loadUsage() {
    var box = $('usageBanner');
    if (!isAdmin()) { box.hidden = true; return; }
    try {
      var data = await api('/api/admin/usage');
      state.usage = data.usage;
      var u = data.usage;
      if (u.level === 'ok') { box.hidden = true; return; }
      box.hidden = false;
      box.className = 'banner' + (u.blocked ? ' blocked' : '');
      box.textContent = u.blocked
        ? '存储已满（' + u.usedText + ' / ' + u.capText + '），上传和下载已自动暂停，避免产生费用。删掉一些资源就能恢复。'
        : '存储快满了：已用 ' + u.usedText + '，可用上限 ' + u.capText + '，还剩 ' + u.remainingText + '。再满一点会自动停止上传。';
    } catch (e) {
      box.hidden = true;
    }
  }

  /* ── 自己的上传额度 ─────────────────────────────────────── */
  async function loadQuota() {
    if (!state.me) { state.quota = null; renderQuota(); return; }
    try {
      var data = await api('/api/quota');
      state.quota = data.quota;
    } catch (e) {
      state.quota = null;
    }
    renderQuota();
  }

  function renderQuota() {
    var banner = $('quotaBanner');
    var line = $('quotaLine');
    var q = state.quota;

    if (!q || q.unlimited || q.level === 'ok') {
      banner.hidden = true;
    } else {
      banner.hidden = false;
      banner.className = 'banner' + (q.blocked ? ' blocked' : '');
      banner.textContent = q.blocked
        ? '你的上传额度已经用满了（' + q.usedText + ' / ' + q.limitText + '）。删掉一些自己传的文件，就能接着传新的。'
        : '你的上传额度用了 ' + q.percent + '%，还剩 ' + q.remainingText + '。';
    }

    if (!q) {
      line.hidden = true;
      return;
    }
    line.hidden = false;
    line.textContent = q.unlimited
      ? '上传不限额。'
      : (q.blocked
        ? '额度已用满：' + q.usedText + ' / ' + q.limitText + '。删掉一些自己传的文件就能继续。'
        : '已用 ' + q.usedText + ' / ' + q.limitText + '，还能传 ' + q.remainingText + '。');
  }

  function renderEditVisibility() {
    $('editVisibilitySeg').innerHTML = state.visibilities.map(function (v) {
      return '<button type="button" class="' + (state.editVisibility === v.id ? 'on' : '') + '" data-evis="' + v.id + '">'
        + esc(v.name) + '</button>';

  function syncEditPlatform() {
    $('ePlatformField').classList.toggle('field-hidden', $('eCat').value !== 'software');

  function openEdit(id) {
    var target = null;
    for (var i = 0; i < state.adminResources.length; i++) {
      if (state.adminResources[i].id === id) { target = state.adminResources[i]; break; }
    }
    if (!target) return;

    state.editingId = id;
    state.editVisibility = target.visibility || 'public';
    $('editWho').textContent = '上传者：' + target.owner + ' · ' + target.fileSize;
    $('eTitle').value = target.title;
    $('eDesc').value = target.description || '';

    $('eCat').innerHTML = state.categories.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === target.category ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');
    $('ePlatform').innerHTML = '<option value="">不指定</option>' + state.platforms.map(function (pl) {
      return '<option value="' + pl.id + '"' + (pl.id === target.platform ? ' selected' : '') + '>' + esc(pl.name) + '</option>';
    }).join('');

    syncEditPlatform();
    renderEditVisibility();
    openModal($('editMask'));
  }

  function saveEdit(e) {
    e.preventDefault();
    if (!state.editingId) return;
    var button = $('editSubmit');
    button.disabled = true;
    api('/api/resources/' + state.editingId, {
      method: 'PATCH',
      body: {
        title: $('eTitle').value.trim(),
        description: $('eDesc').value.trim(),
        category: $('eCat').value,
        platform: $('eCat').value === 'software' ? $('ePlatform').value : '',
        visibility: state.editVisibility,
      },
    }).then(function () {
      toast('改好了');
      closeModal($('editMask'));
      loadAdminResources();
      loadCounts();
      loadList();
    }).catch(function (err) {
      toast(err.message);
    }).then(function () {
      button.disabled = false;
    });
  }

  function openAdmin() {
    $('invResult').hidden = true;
    openModal($('adminMask'));
    switchAdminTab(state.adminTab);
    loadInvites();
  }

  function createInvite() {
    var button = $('invCreate');
    button.disabled = true;
    api('/api/admin/invites', {
      method: 'POST',
      body: {
        role: $('invRole').value,
        maxUses: Number($('invUses').value) || 1,
        expiresInDays: Number($('invDays').value) || 0,
      },
    }).then(function (data) {
      $('invCode').textContent = data.invite.formatted;
      $('invResult').hidden = false;
      loadInvites();
      toast('邀请码生成了，复制发给对方');
    }).catch(function (err) {
      toast(err.message);
    }).then(function () {
      button.disabled = false;
    });
  }

  /* ── 须知弹窗 ───────────────────────────────────────────── */
  function openNotes() {
    try { $('notesMute').checked = localStorage.getItem(NOTES_KEY) === '1'; } catch (e) {}
    openModal($('notesMask'));
  }
  function dismissNotes() {
    try {
      if ($('notesMute').checked) localStorage.setItem(NOTES_KEY, '1');
      else localStorage.removeItem(NOTES_KEY);
    } catch (e) {}
    closeModal($('notesMask'));
  }
  dismissers.notesMask = dismissNotes;

  /* ── 事件绑定 ───────────────────────────────────────────── */
  var searchTimer;
  $('q').addEventListener('input', function (e) {
    var value = e.target.value;
    $('searchWrap').classList.toggle('has', !!value);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = value.trim();
      loadList();
    }, 200);
  });
  function clearSearch() {
    $('q').value = '';
    $('searchWrap').classList.remove('has');
    state.query = '';
    loadList();
  }
  $('clr').addEventListener('click', clearSearch);

  $('cats').addEventListener('click', function (e) {
    var button = e.target.closest('.drawer');
    if (!button) return;
    state.category = button.dataset.cat;
    state.platform = 'all';
    renderCats();
    loadList();
  });

  $('subdrawers').addEventListener('click', function (e) {
    var button = e.target.closest('.sub');
    if (!button) return;
    state.platform = button.dataset.platform;
    renderSubdrawers();
    loadList();
  });

  $('sortBy').addEventListener('change', function (e) {
    state.sort = e.target.value;
    loadList();
  });

  $('scopes').addEventListener('click', function (e) {
    var button = e.target.closest('button[data-scope]');
    if (!button) return;
    if (button.dataset.scope === 'me' && !state.me) {
      state.pendingUpload = true;
      openAuth('login');
      toast('登录之后才能看到自己的上传');
      return;
    }
    setScope(button.dataset.scope);
  });

  $('list').addEventListener('click', function (e) {
    if (e.target.closest('[data-open-upload]')) { openUpload(); return; }
    if (e.target.closest('[data-clear-search]')) { clearSearch(); return; }

    var removeBtn = e.target.closest('[data-del]');
    if (removeBtn) {
      if (!confirm('删掉就找不回来了，确定吗？')) return;
      api('/api/resources/' + removeBtn.dataset.del, { method: 'DELETE' })
        .then(function () {
          toast('已经删掉了');
          loadUsage();
          loadQuota();
          loadCounts();
          loadList();
        })
        .catch(function (err) { toast(err.message); });
      return;
    }
    var viewBtn = e.target.closest('[data-view]');
    if (viewBtn) { openPreview(viewBtn.dataset.view); return; }

    if (e.target.closest('[data-dl]')) setTimeout(loadList, 1200);
  });

  $('file').addEventListener('change', function (e) {
    if (e.target.files[0]) {
      state.pickedFile = e.target.files[0];
      showPicked();
    }
  });
  $('uCat').addEventListener('change', syncPlatformField);
  $('visibilitySeg').addEventListener('click', function (e) {
    var button = e.target.closest('button[data-vis]');
    if (!button) return;
    state.visibility = button.dataset.vis;
    renderVisibilitySeg();
  });
  $('uploadForm').addEventListener('submit', doUpload);
  $('uploadClose').addEventListener('click', function () { closeModal($('uploadMask')); });
  $('uploadCancel').addEventListener('click', function () { closeModal($('uploadMask')); });
  
  $('authTabs').addEventListener('click', function (e) {
    var button = e.target.closest('button[data-tab]');
    if (!button) return;
    state.authMode = button.dataset.tab;
    syncAuth();
  });
  $('authForm').addEventListener('submit', doAuth);
  $('authClose').addEventListener('click', function () { closeModal($('authMask')); });
  
  $('adminTabs').addEventListener('click', function (e) {
    var button = e.target.closest('button[data-atab]');
    if (button) switchAdminTab(button.dataset.atab);
  });
  $('resourceList').addEventListener('click', function (e) {
    var button = e.target.closest('[data-edit]');
    if (button) openEdit(button.dataset.edit);
  });
  $('editVisibilitySeg').addEventListener('click', function (e) {
    var button = e.target.closest('button[data-evis]');
    if (!button) return;
    state.editVisibility = button.dataset.evis;
    renderEditVisibility();
  });
  $('eCat').addEventListener('change', syncEditPlatform);
  $('editForm').addEventListener('submit', saveEdit);
  $('editClose').addEventListener('click', function () { closeModal($('editMask')); });
  $('editCancel').addEventListener('click', function () { closeModal($('editMask')); });

  $('inviteList').addEventListener('click', function (e) {
    var button = e.target.closest('[data-revoke]');
    if (!button) return;
    if (!confirm('作废之后这个邀请码就不能注册了，确定吗？')) return;
    api('/api/admin/invites/revoke', { method: 'POST', body: { code: button.dataset.revoke } })
      .then(function () { toast('作废了'); return loadInvites(); })
      .catch(function (err) { toast(err.message); });
  });

  $('invCreate').addEventListener('click', createInvite);
  $('invCopy').addEventListener('click', function () {
    var text = $('invCode').textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { toast('复制好了'); }).catch(function () { toast('复制失败，手动选一下'); });
    } else {
      toast('这个浏览器不给复制，手动选一下');
    }
  });
  $('adminClose').addEventListener('click', function () { closeModal($('adminMask')); });
  $('adminDone').addEventListener('click', function () { closeModal($('adminMask')); });
  
  $('previewClose').addEventListener('click', closePreview);
  $('previewDone').addEventListener('click', closePreview);
  $('previewMask').addEventListener('click', function (e) {
    if (e.target === $('previewMask')) closePreview();
  });

  $('notesLink').addEventListener('click', openNotes);
  $('notesOk').addEventListener('click', dismissNotes);
  $('notesClose').addEventListener('click', dismissNotes);
  
  /* ── 启动 ─────────────────────────────────────────────────── */
  (async function boot() {
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    try {
      var catalog = await api('/api/catalog');
      state.categories = catalog.categories || [];
      state.platforms = catalog.platforms || [];
      state.visibilities = catalog.visibilities || [];
    } catch (e) { /* 拿不到目录时页面仍可用 */ }
    try {
      var me = await api('/api/me');
      state.me = me.user;
    } catch (e) { state.me = null; }
    renderUser();
    renderCats();
    renderVisibilitySeg();
    loadUsage();
    loadQuota();
    startBackgroundLetters();
    wireDrop();
    await loadCounts();
    await loadList();
    try {
      if (localStorage.getItem(NOTES_KEY) !== '1') openNotes();
    } catch (e) {}
  })();
})();
</script>
</body>
</html>
