# Cloudflare Workers 配置
# 部署前需要把下面的 database_id 换成你自己的 D1 编号

name = "reshub"
main = "src/worker.js"

# 这个日期之后 nodejs_compat 默认开启，node:crypto 等可以直接用
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# 前端静态文件：public/ 里的文件由 Cloudflare 直接发出去，
# 只有 /api/* 的请求才会进到 Worker 里
[assets]
directory = "./public"
binding = "ASSETS"

# 文件存 R2（先在控制台建一个同名存储桶）
[[r2_buckets]]
binding = "FILES"
bucket_name = "reshub-files"

# 备用方案：不想开通 R2 的话，改用 Workers KV。
# 把上面 R2 那段注释掉，去掉下面这段的注释，并在控制台加一个变量 FILE_BACKEND=kv
# [[kv_namespaces]]
# binding = "FILES"
# id = "在这里填你的 KV 命名空间 ID"

# 账号和资源信息存这里（database_id 留待填写）
[[d1_databases]]
binding = "DB"
database_name = "reshub"
database_id = "03d771d3-34d0-4e2c-8869-40541ab8b4ba"

# 第一个管理员用的一次性暗号，在控制台里配置成密钥，不要写进代码
# BOOTSTRAP_CODE = "..."

# ── 用量保护（全部可选，不填就用下面的默认值）──────────────────
# 默认按 Cloudflare 免费额度算：R2 每月 10GB 存储，从这里预留 200MB 当缓冲。
# 用到 80% 开始给管理员显示提醒；顶到上限（10GB - 200MB）自动停止上传，
# 免得产生费用。
#
# [vars]
# STORAGE_LIMIT_MB = "10240"       # 免费额度，默认 10GB
# STORAGE_RESERVE_MB = "200"       # 预留缓冲，默认 200MB
# STORAGE_WARN_PERCENT = "80"      # 到几成开始提醒
# GUARD_BLOCK_DOWNLOADS = "true"   # 满了要不要连下载也停；填 false 就只停上传
# USER_QUOTA_MB = "1024"          # 每个人自己的上传额度，默认 1GB；管理员不受限
